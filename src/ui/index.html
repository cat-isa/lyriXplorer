<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyriXplorer 🎵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .search-results {
            grid-column: 1 / -1;
        }

        .result-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .song-info h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .song-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .score {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .lyrics-excerpt {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-style: italic;
            color: #555;
            margin-top: 10px;
            border-left: 3px solid #667eea;
        }

        .matched-terms {
            margin-top: 10px;
        }

        .matched-terms span {
            background: #e3f2fd;
            color: #1976d2;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 LyriXplorer</h1>
            <p>Discover songs through lyrics and emotions</p>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="total-songs">0</div>
                <div class="stat-label">Total Songs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unique-artists">0</div>
                <div class="stat-label">Unique Artists</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unique-albums">0</div>
                <div class="stat-label">Unique Albums</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>🔍 Search Songs</h2>
                <form id="search-form">
                    <div class="form-group">
                        <label for="search-query">Search Query</label>
                        <textarea id="search-query" placeholder="Enter lyrics, emotions, or concepts to search for..." rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="search-type">Search Type</label>
                        <select id="search-type">
                            <option value="hybrid">Hybrid (Recommended)</option>
                            <option value="semantic">Semantic</option>
                            <option value="keyword">Keyword</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="max-results">Max Results</label>
                        <input type="number" id="max-results" value="10" min="1" max="50">
                    </div>
                    <button type="submit" class="btn">Search</button>
                </form>
            </div>

            <div class="card">
                <h2>📥 Import Playlist</h2>
                <form id="import-form">
                    <div class="form-group">
                        <label for="playlist-id">Spotify Playlist ID</label>
                        <input type="text" id="playlist-id" placeholder="Enter playlist ID from Spotify URL">
                    </div>
                    <div class="form-group">
                        <label for="playlist-name">Playlist Name (Optional)</label>
                        <input type="text" id="playlist-name" placeholder="Enter a name for this playlist">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="fetch-lyrics" checked>
                            Fetch lyrics automatically
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="generate-embeddings" checked>
                            Generate embeddings for search
                        </label>
                    </div>
                    <button type="submit" class="btn">Import Playlist</button>
                </form>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Processing your request...
        </div>

        <div id="search-results" class="search-results" style="display: none;">
            <h2>Search Results</h2>
            <div id="results-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', loadStats);

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();
                
                document.getElementById('total-songs').textContent = stats.total_songs || 0;
                document.getElementById('unique-artists').textContent = stats.unique_artists || 0;
                document.getElementById('unique-albums').textContent = stats.unique_albums || 0;
                document.getElementById('stats').style.display = 'grid';
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Search form handler
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = document.getElementById('search-query').value.trim();
            if (!query) {
                showError('Please enter a search query');
                return;
            }

            const searchData = {
                query: query,
                search_type: document.getElementById('search-type').value,
                max_results: parseInt(document.getElementById('max-results').value)
            };

            showLoading();
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(searchData)
                });

                const results = await response.json();
                hideLoading();
                
                if (results.results && results.results.length > 0) {
                    displaySearchResults(results);
                } else {
                    showError('No results found for your search query');
                }
            } catch (error) {
                hideLoading();
                showError('Search failed. Please try again.');
                console.error('Search error:', error);
            }
        });

        // Import form handler
        document.getElementById('import-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const playlistId = document.getElementById('playlist-id').value.trim();
            if (!playlistId) {
                showError('Please enter a playlist ID');
                return;
            }

            const importData = {
                playlist_id: playlistId,
                playlist_name: document.getElementById('playlist-name').value.trim() || null,
                fetch_lyrics: document.getElementById('fetch-lyrics').checked,
                generate_embeddings: document.getElementById('generate-embeddings').checked
            };

            showLoading();
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/import-playlist`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(importData)
                });

                const result = await response.json();
                hideLoading();
                
                if (response.ok) {
                    showSuccess(`Playlist imported successfully! Found ${result.tracks_found} tracks, fetched ${result.lyrics_fetched} lyrics, and generated ${result.embeddings_generated} embeddings.`);
                    loadStats(); // Refresh stats
                } else {
                    showError(result.detail || 'Import failed');
                }
            } catch (error) {
                hideLoading();
                showError('Import failed. Please try again.');
                console.error('Import error:', error);
            }
        });

        function displaySearchResults(results) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            results.results.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = 'result-item';
                
                resultElement.innerHTML = `
                    <div class="result-header">
                        <div class="song-info">
                            <h3>${result.song.title}</h3>
                            <p>${result.song.artist}${result.song.album ? ` • ${result.song.album}` : ''}</p>
                        </div>
                        <div class="score">${(result.relevance_score * 100).toFixed(1)}%</div>
                    </div>
                    <div class="lyrics-excerpt">${result.lyrics_excerpt}</div>
                    ${result.matched_terms && result.matched_terms.length > 0 ? 
                        `<div class="matched-terms">Matched terms: ${result.matched_terms.map(term => `<span>${term}</span>`).join('')}</div>` : 
                        ''}
                `;
                
                container.appendChild(resultElement);
            });

            document.getElementById('search-results').style.display = 'block';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.main-content'));
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.querySelector('.main-content'));
        }

        function clearMessages() {
            const messages = document.querySelectorAll('.error, .success');
            messages.forEach(msg => msg.remove());
        }
    </script>
</body>
</html>
